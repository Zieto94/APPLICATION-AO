<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appel d'Offres — Plan de Formation 2026 | Orange CI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--or:#ff7900;--or-d:#e56e00;--bk:#0a0a0a;--g1:#f4f4f5;--g2:#e4e4e7;--g3:#a1a1aa;--g4:#52525b;--ok:#16a34a;--warn:#dc2626}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--g1);color:var(--bk);line-height:1.45}
  #root{min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-weight:600;transition:.15s}
  input,select{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--g2);border-radius:8px;width:100%;background:#fff}
  input:focus,select:focus{outline:2px solid var(--or);border-color:var(--or)}
  .btn{background:var(--or);color:#fff;padding:11px 18px;font-size:14px}
  .btn:hover{background:var(--or-d)}
  .btn.dark{background:var(--bk)} .btn.dark:hover{background:#27272a}
  .btn.ghost{background:#fff;color:var(--bk);border:1px solid var(--g2)} .btn.ghost:hover{border-color:var(--g4)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .card{background:#fff;border:1px solid var(--g2);border-radius:12px}
  .topbar{background:var(--bk);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
  .logo{width:34px;height:34px;background:var(--or);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#000}
  .wrap{max-width:1180px;margin:0 auto;padding:22px}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
  .lotb{background:var(--bk);color:var(--or)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--g2)}
  th{background:var(--g1);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--g4)}
  tr:hover td{background:#fffaf3}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .tab{padding:9px 16px;border-radius:8px;background:#fff;border:1px solid var(--g2);font-weight:600;font-size:14px}
  .tab.on{background:var(--bk);color:#fff;border-color:var(--bk)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:26px}
  .row{display:flex;gap:12px} .col{flex:1}
  .mut{color:var(--g4);font-size:13px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .field{margin-bottom:16px}
  .badge-ok{color:var(--ok);font-weight:700}
  .drop{border:2px dashed var(--g2);border-radius:10px;padding:14px;text-align:center;font-size:13px;color:var(--g4);cursor:pointer;display:block}
  .drop:hover{border-color:var(--or);color:var(--or)}
  .note-chip{font-weight:800;padding:3px 8px;border-radius:6px;font-size:13px}
  .banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px 15px;border-radius:10px;font-size:13px;margin-bottom:16px}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .search{max-width:340px}
  .stat{font-size:26px;font-weight:800}
  a.dl{color:var(--or);font-weight:600;text-decoration:none;font-size:13px;cursor:pointer}
  a.dl:hover{text-decoration:underline}
  .center{max-width:440px;margin:50px auto}
  .link{color:var(--or);cursor:pointer;font-weight:600}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--g2);border-top-color:var(--or);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback} = React;

/* ============================================================
   >>> CONFIGURATION SUPABASE (voir GUIDE_DEPLOIEMENT.md) <<<
   ============================================================ */
const SUPABASE_PROJECT  = "https://hehzubjnsnihfzzbgwyd.supabase.co"; // projet Supabase (accès direct)
/* Contournement des blocages réseau (ex. réseau OCI qui bloque supabase.co) :
   une fois l'app HÉBERGÉE (https), on route Supabase via /supabase/* (proxy Netlify
   défini dans le fichier _redirects) — le navigateur ne contacte alors que votre
   propre domaine. En ouverture LOCALE (file://), on garde l'accès direct. */
const SUPABASE_URL      = (location.protocol === "https:") ? (location.origin + "/supabase") : SUPABASE_PROJECT;
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhlaHp1Ympuc25paGZ6emJnd3lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MDQwNzAsImV4cCI6MjA5OTE4MDA3MH0.H1QC85y7KLqcQP3mm2ZV_xva8USNWni-x_dtMk_hoEg";
/* Domaine technique interne : la connexion se fait par NOM D'ENTREPRISE,
   converti en e-mail interne <slug>@ao.local (jamais affiché à l'utilisateur). */
const MAIL_DOMAIN = "ao.local";
/* Sociétés qui ouvrent l'espace ADMIN (en plus du rôle 'admin' en base).
   ⚠️ Ceci n'ouvre que l'ÉCRAN admin. Pour voir les données de TOUS les
   prestataires, il faut AUSSI passer le rôle en base une fois (voir GUIDE). */
const ADMIN_COMPANIES = ["ORANGE"];
/* ============================================================ */

const CONFIGURED = !SUPABASE_URL.includes("VOTRE-PROJET") && !SUPABASE_ANON_KEY.includes("VOTRE_CLE");
let sb = null;
try { if(CONFIGURED && window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
catch(e){ console.error("Supabase createClient:", e); }

/* ---------- Helpers ---------- */
const safe = s => (s||"").replace(/[\\/:*?"<>|\n\r]+/g,"_").replace(/\s+/g," ").trim();
const fmt  = n => (n||n===0) ? Number(n).toLocaleString("fr-FR") : "—";
const numPart = s => { const m=(s||"").match(/\d+/); return m?+m[0]:999; };
const sortForm = a => a.slice().sort((x,y)=>numPart(x.num)-numPart(y.num));
/* nom d'entreprise -> e-mail interne stable */
const slug = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9]+/g,".").replace(/^\.+|\.+$/g,"").slice(0,40) || "societe";
const emailFor = c => slug(c)+"@"+MAIL_DOMAIN;

/* Note « Coût de la prestation » /10 : budget = 6 ; moins cher -> vers 10 ; plus cher -> vers 1 (bornée 1..10) */
function noteCout(montant,budget){
  montant=+montant; budget=+budget;
  if(!montant||!budget||montant<=0||budget<=0) return null;
  let n = montant<=budget ? 6 + 4*(budget-montant)/budget : 6 - 5*(montant-budget)/budget;
  return Math.round(Math.max(1,Math.min(10,n))*100)/100;
}
const noteColor = n => n==null?"#e4e4e7": n>=6?"#dcfce7": n>=4?"#fef9c3":"#fee2e2";
function dl(blob,name){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }

/* ---------- Excel : FICHE D'ÉVALUATION / COMPARATIF d'une formation ----------
   Reproduit le template « EVALUATION FORMATION ». Seule la ligne
   « Coût de la prestation » est calculée ; le reste est laissé vide
   (notation technique manuelle). Note pondérée = pondération × Note/10. */
function comparatifAOA(f,subs){
  const crit=(lib,pond,fn)=>{ const r=["",lib,pond]; subs.forEach(s=>{ const v=fn?fn(s):["",""]; r.push(v[0],v[1]); }); return r; };
  const r5=["","LIBELLES","pondération"]; subs.forEach(s=>r5.push(s.company_name,""));
  const r6=["","",""]; subs.forEach(()=>r6.push("Note/10","Note pondérée"));
  const rmt=["","Montant HT soumis (FCFA)",""]; subs.forEach(s=>rmt.push(s.montant_ht,""));
  return [
    ["","Evaluation par pondération","PLAN DE FORMATION 2026"],
    [],
    ["","","Thème"],
    ["","Evaluation des offres techniques et commerciale", f.num+" — "+f.intitule],
    ["","Budget de référence (HT)", f.budget||""],
    ["","Critères"],
    r5, r6,
    crit("Habilitation FDFP",0.1),
    crit("Expertise dans le domaine",0.2),
    crit("Proposition technique",0.3),
    crit("Total technique",""),
    crit("Coût de la prestation",0.5, s=>{ const n=noteCout(s.montant_ht,f.budget); return n==null?["",""]:[n, Math.round(n*0.5/10*10000)/10000]; }),
    crit("Total",1),
    crit("Classement Global",""),
    [], rmt
  ];
}
function comparatifWS(f,subs){
  const ws=XLSX.utils.aoa_to_sheet(comparatifAOA(f,subs));
  const merges=[]; subs.forEach((s,i)=>{ const c=3+i*2; merges.push({s:{r:6,c},e:{r:6,c:c+1}}); }); // r6 = ligne noms (index 6)
  ws["!merges"]=merges;
  ws["!cols"]=[{wch:2},{wch:34},{wch:12}].concat(subs.flatMap(()=>[{wch:9},{wch:13}]));
  return ws;
}
const wbFromWS = pairs => { const wb=XLSX.utils.book_new(); pairs.forEach(([n,ws])=>XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31))); return wb; };
const wbFromAOA = pairs => wbFromWS(pairs.map(([n,aoa])=>[n,XLSX.utils.aoa_to_sheet(aoa)]));
const wbBlob = wb => new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});

/* ---------- Excel : RÉCAP GLOBAL (78 formations × budget × montant/fournisseur) ---------- */
function recapAOA(formations,subs){
  const sups=[...new Set(subs.map(s=>s.company_name))].sort();
  const head=["N°","Lot","Intitulé","Budget HT (réf.)",...sups.map(s=>s+" — Montant HT")];
  const rows=[head];
  sortForm(formations).forEach(f=>{
    const row=[f.num,f.lot,f.intitule,f.budget||""];
    sups.forEach(sp=>{ const sub=subs.find(x=>x.formation_num===f.num&&x.company_name===sp); row.push(sub?sub.montant_ht:""); });
    rows.push(row);
  });
  return rows;
}

/* ============ UI de base ============ */
function Topbar({sub,right}){ return <div className="topbar">
  <div className="logo">O</div>
  <div><div style={{fontWeight:800,fontSize:15}}>Appel d'Offres — Plan de Formation 2026</div>
  <div style={{fontSize:12,opacity:.7}}>{sub}</div></div>
  <div style={{marginLeft:"auto"}}>{right}</div>
</div>; }

/* ============ AUTHENTIFICATION (nom d'entreprise + mot de passe) ============ */
function AuthScreen(){
  const [mode,setMode]=useState("login");
  const [company,setCompany]=useState(""); const [pwd,setPwd]=useState("");
  const [msg,setMsg]=useState(""); const [busy,setBusy]=useState(false);

  async function go(){
    setMsg("");
    if(!company.trim()){ setMsg("⚠ Indiquez le nom de votre société."); return; }
    if(pwd.length<6){ setMsg("⚠ Mot de passe : 6 caractères minimum."); return; }
    setBusy(true);
    const email=emailFor(company);
    try{
      if(mode==="signup"){
        const {data,error}=await sb.auth.signUp({email,password:pwd,options:{data:{company_name:company.trim()}}});
        if(error) throw error;
        if(!data.session){ setMsg("✓ Compte créé. Vous pouvez vous connecter."); setMode("login"); }
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password:pwd});
        if(error) throw error.message&&/invalid/i.test(error.message)?new Error("Nom de société ou mot de passe incorrect."):error;
      }
    }catch(e){ setMsg("⚠ "+(e.message||"Erreur")); }
    setBusy(false);
  }

  return <div>
    <Topbar sub="Direction des Achats · Orange Côte d'Ivoire"/>
    <div className="center">
      <div className="card" style={{padding:28}}>
        <h2 style={{marginBottom:4}}>{mode==="login"?"Connexion prestataire":"Créer un compte prestataire"}</h2>
        <p className="mut" style={{marginBottom:20}}>Plateforme de dépôt des offres — 78 formations, 4 lots.</p>
        <div className="field"><label>Nom de la société</label>
          <input value={company} onChange={e=>setCompany(e.target.value)} placeholder="Ex : CABINET I2C" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
        <div className="field"><label>Mot de passe</label>
          <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
        {msg && <div style={{fontSize:13,marginBottom:12,color:msg[0]==="✓"?"var(--ok)":"var(--warn)"}}>{msg}</div>}
        <button className="btn" style={{width:"100%"}} disabled={busy} onClick={go}>
          {busy?<span className="spin"/>:(mode==="login"?"Se connecter":"Créer mon compte")}</button>
        <p className="mut" style={{marginTop:16,textAlign:"center"}}>
          {mode==="login"? <>Pas encore de compte ? <span className="link" onClick={()=>{setMode("signup");setMsg("");}}>S'inscrire</span></>
                         : <>Déjà inscrit ? <span className="link" onClick={()=>{setMode("login");setMsg("");}}>Se connecter</span></>}
        </p>
      </div>
      <p className="mut" style={{textAlign:"center",marginTop:14,fontSize:12}}>Connexion par nom d'entreprise — aucun e-mail requis. L'accès administrateur (OCI) est activé côté base.</p>
    </div>
  </div>;
}

/* ============ ESPACE FOURNISSEUR ============ */
function SupplierApp({session,profile,onLogout}){
  const uid=session.user.id, company=profile.company_name||session.user.email;
  const [forms,setForms]=useState([]); const [subs,setSubs]=useState([]); const [q,setQ]=useState(""); const [openF,setOpenF]=useState(null); const [loading,setLoading]=useState(true);

  const load=useCallback(async()=>{
    setLoading(true);
    const {data:fd}=await sb.from("formations").select("*").eq("a_coter",true);
    const {data:sd}=await sb.from("submissions").select("*").eq("supplier_id",uid);
    setForms(fd||[]); setSubs(sd||[]); setLoading(false);
  },[uid]);
  useEffect(()=>{ load(); },[load]);

  const lots=[...new Set(forms.map(f=>f.lot))].sort();
  const titre=Object.fromEntries(forms.map(f=>[f.lot,f.lot_titre]));
  const mine=Object.fromEntries(subs.map(s=>[s.formation_num,s]));
  const list=forms.filter(f=>!q||(f.num+" "+f.intitule).toLowerCase().includes(q.toLowerCase()));

  return <div>
    <Topbar sub={"Prestataire : "+company} right={<button className="btn ghost sm" onClick={onLogout}>Déconnexion</button>}/>
    <div className="wrap">
      <div className="banner">🔒 Confidentialité garantie côté base de données : vous ne voyez que <b>vos</b> soumissions. Les offres des autres prestataires vous sont totalement inaccessibles.</div>
      {loading? <p className="mut"><span className="spin"/> Chargement…</p> : <>
      <div className="row" style={{alignItems:"center",marginBottom:16}}>
        <div><div className="stat" style={{color:"var(--or)"}}>{subs.length}<span style={{fontSize:15,color:"var(--g4)"}}> / {forms.length}</span></div>
          <div className="mut">formations soumises</div></div>
        <input className="search" style={{marginLeft:"auto"}} placeholder="Rechercher une formation…" value={q} onChange={e=>setQ(e.target.value)}/>
      </div>
      {lots.map(lot=>{ const items=sortForm(list.filter(f=>f.lot===lot)); if(!items.length) return null;
        return <div key={lot} style={{marginBottom:22}}>
          <div style={{display:"flex",alignItems:"center",gap:10,margin:"6px 0 10px"}}>
            <span className="pill lotb">{lot}</span><b>{titre[lot]}</b><span className="mut">· {items.length} formations</span></div>
          <div className="card" style={{overflow:"hidden"}}>
            <table><thead><tr><th style={{width:60}}>N°</th><th>Intitulé</th><th style={{width:150}}>Montant HT</th><th style={{width:120}}>Statut</th><th style={{width:100}}></th></tr></thead>
            <tbody>{items.map(f=>{ const s=mine[f.num]; return <tr key={f.num}>
              <td><b>{f.num}</b></td><td>{f.intitule}</td>
              <td>{s?fmt(s.montant_ht)+" F":"—"}</td>
              <td>{s?<span className="badge-ok">✓ Soumis</span>:<span className="mut">À soumettre</span>}</td>
              <td><button className="btn sm ghost" onClick={()=>setOpenF(f)}>{s?"Modifier":"Soumettre"}</button></td>
            </tr>; })}</tbody></table>
          </div>
        </div>;
      })}</>}
    </div>
    {openF && <SubmitModal f={openF} uid={uid} company={company} existing={mine[openF.num]} onClose={()=>setOpenF(null)} onSaved={()=>{setOpenF(null);load();}}/>}
  </div>;
}

function SubmitModal({f,uid,company,existing,onClose,onSaved}){
  const [montant,setMontant]=useState(existing?existing.montant_ht:"");
  const [tech,setTech]=useState(null); const [fin,setFin]=useState(null);
  const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);

  async function up(file,kind){
    const path=`${uid}/${f.num}/${kind}_${Date.now()}_${safe(file.name)}`;
    const {error}=await sb.storage.from("offres").upload(path,file,{upsert:true});
    if(error) throw error; return {path,name:file.name};
  }
  async function submit(){
    setErr("");
    if(!montant||+montant<=0){ setErr("Indiquez un montant HT valide."); return; }
    if(!existing && (!tech||!fin)){ setErr("Joignez l'offre technique ET l'offre financière."); return; }
    setBusy(true);
    try{
      let tp=existing?.tech_path, tn=existing?.tech_name, fp=existing?.fin_path, fn=existing?.fin_name;
      if(tech){ const r=await up(tech,"technique"); tp=r.path; tn=r.name; }
      if(fin){ const r=await up(fin,"financiere"); fp=r.path; fn=r.name; }
      const {error}=await sb.from("submissions").upsert({
        formation_num:f.num, supplier_id:uid, company_name:company, montant_ht:+montant,
        tech_path:tp, tech_name:tn, fin_path:fp, fin_name:fn, updated_at:new Date().toISOString()
      },{onConflict:"formation_num,supplier_id"});
      if(error) throw error;
      onSaved();
    }catch(e){ setErr("⚠ "+(e.message||"Erreur d'enregistrement")); setBusy(false); }
  }
  const Drop=({label,file,cur,set})=> <div className="field">
    <label>{label}{cur&&!file&&<span className="mut"> · actuel : {cur}</span>}</label>
    <label className="drop">{file?("📎 "+file.name):(cur?"Remplacer le fichier…":"Cliquez pour joindre le fichier")}
      <input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.zip,.rar,.png,.jpg" style={{display:"none"}} onChange={e=>set(e.target.files[0]||null)}/></label></div>;

  return <div className="modal-bg" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}><span className="pill lotb">{f.lot}</span><b>{f.num}</b></div>
    <h2 style={{fontSize:19,marginBottom:16}}>{f.intitule}</h2>
    <div className="field"><label>Montant HT facturé (FCFA)</label>
      <input type="number" value={montant} onChange={e=>setMontant(e.target.value)} placeholder="Ex : 1 500 000"/></div>
    <Drop label="Offre technique" file={tech} cur={existing?.tech_name} set={setTech}/>
    <Drop label="Offre financière" file={fin} cur={existing?.fin_name} set={setFin}/>
    {err&&<div style={{color:"var(--warn)",fontSize:13,marginBottom:12}}>{err}</div>}
    <div className="row" style={{marginTop:6}}>
      <button className="btn ghost col" onClick={onClose}>Annuler</button>
      <button className="btn col" disabled={busy} onClick={submit}>{busy?<span className="spin"/>:"Déposer mon offre"}</button>
    </div>
  </div></div>;
}

/* ============ ESPACE ADMIN ============ */
function AdminApp({session,profile,onLogout}){
  const [tab,setTab]=useState("tree");
  const [forms,setForms]=useState([]); const [subs,setSubs]=useState([]); const [loading,setLoading]=useState(true);
  const load=useCallback(async()=>{
    setLoading(true);
    const {data:fd}=await sb.from("formations").select("*");
    const {data:sd}=await sb.from("submissions").select("*");
    setForms(fd||[]); setSubs(sd||[]); setLoading(false);
  },[]);
  useEffect(()=>{ load(); },[load]);

  const T=[["tree","🗂 Arborescence"],["budget","💰 Budgets"],["recap","📊 Récap & Export"]];
  return <div>
    <Topbar sub="Administration · Direction des Achats" right={<button className="btn ghost sm" onClick={onLogout}>Déconnexion</button>}/>
    <div className="wrap">
      <div className="tabs">{T.map(([k,l])=><button key={k} className={"tab"+(tab===k?" on":"")} onClick={()=>setTab(k)}>{l}</button>)}
        <button className="btn ghost sm" style={{marginLeft:"auto"}} onClick={load}>↻ Actualiser</button></div>
      {loading? <p className="mut"><span className="spin"/> Chargement…</p> :
        tab==="tree"? <Tree forms={forms} subs={subs} onChange={load}/> :
        tab==="budget"? <Budgets forms={forms} subs={subs} onSaved={load}/> :
        <Recap forms={forms} subs={subs}/>}
    </div>
  </div>;
}

async function signedUrl(path){ const {data,error}=await sb.storage.from("offres").createSignedUrl(path,120); if(error) throw error; return data.signedUrl; }

function Tree({forms,subs,onChange}){
  const [open,setOpen]=useState({}); const [openF,setOpenF]=useState({});
  const lots=[...new Set(forms.map(f=>f.lot))].sort();
  const titre=Object.fromEntries(forms.map(f=>[f.lot,f.lot_titre]));
  const byNum={}; subs.forEach(s=>{(byNum[s.formation_num]=byNum[s.formation_num]||[]).push(s);});
  const participants=new Set(subs.map(s=>s.company_name)).size;

  async function open1(path,fname){ try{ const u=await signedUrl(path); const a=document.createElement("a"); a.href=u; a.download=fname; a.target="_blank"; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ alert("Fichier indisponible : "+e.message); } }
  async function remove(s){ if(confirm(`Supprimer la soumission de ${s.company_name} pour ${s.formation_num} ?`)){ await sb.from("submissions").delete().eq("id",s.id); onChange(); } }

  return <div>
    <div className="grid-cards" style={{marginBottom:20}}>
      <div className="card" style={{padding:16}}><div className="stat">{subs.length}</div><div className="mut">soumissions</div></div>
      <div className="card" style={{padding:16}}><div className="stat">{participants}</div><div className="mut">prestataires actifs</div></div>
      <div className="card" style={{padding:16}}><div className="stat">{Object.keys(byNum).length}<span style={{fontSize:15,color:"var(--g4)"}}>/{forms.length}</span></div><div className="mut">formations couvertes</div></div>
    </div>
    {lots.map(lot=>{ const items=sortForm(forms.filter(f=>f.lot===lot && byNum[f.num]));
      const cnt=items.reduce((a,f)=>a+byNum[f.num].length,0);
      return <div key={lot} className="card" style={{marginBottom:14,overflow:"hidden"}}>
        <div style={{padding:"14px 18px",display:"flex",alignItems:"center",gap:10,cursor:"pointer",background:"var(--bk)",color:"#fff"}} onClick={()=>setOpen(o=>({...o,[lot]:!o[lot]}))}>
          <span style={{color:"var(--or)"}}>{open[lot]?"▼":"▶"}</span>
          <b style={{color:"var(--or)"}}>{titre[lot]||lot}</b>
          <span style={{marginLeft:"auto",fontSize:13,opacity:.8}}>{items.length} formations · {cnt} offres</span>
        </div>
        {open[lot] && <div style={{padding:"6px 10px 12px"}}>
          {!items.length && <p className="mut" style={{padding:12}}>Aucune soumission dans ce lot.</p>}
          {items.map(f=>{ const ss=byNum[f.num];
            return <div key={f.num} style={{borderTop:"1px solid var(--g2)"}}>
              <div style={{padding:"10px 12px",display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setOpenF(o=>({...o,[f.num]:!o[f.num]}))}>
                <span className="mut">{openF[f.num]?"▼":"▶"}</span><b>{f.num}</b>
                <span style={{flex:1}}>{f.intitule}</span><span className="mut">{ss.length} prestataire(s)</span></div>
              {openF[f.num] && <div style={{padding:"0 12px 12px 34px"}}>
                <table><thead><tr><th>Prestataire</th><th>Montant HT</th><th>Note coût /10</th><th>Offre tech.</th><th>Offre fin.</th><th></th></tr></thead>
                <tbody>{ss.slice().sort((a,b)=>a.montant_ht-b.montant_ht).map(s=>{ const n=noteCout(s.montant_ht,f.budget);
                  return <tr key={s.id}>
                    <td><b>{s.company_name}</b></td><td>{fmt(s.montant_ht)} F</td>
                    <td><span className="note-chip" style={{background:noteColor(n)}}>{n==null?"budget ?":n}</span></td>
                    <td>{s.tech_path?<a className="dl" onClick={()=>open1(s.tech_path,`${f.num}_${safe(s.company_name)}_tech_${s.tech_name}`)}>⬇ {(s.tech_name||"").slice(0,16)}</a>:"—"}</td>
                    <td>{s.fin_path?<a className="dl" onClick={()=>open1(s.fin_path,`${f.num}_${safe(s.company_name)}_fin_${s.fin_name}`)}>⬇ {(s.fin_name||"").slice(0,16)}</a>:"—"}</td>
                    <td><button className="btn sm ghost" onClick={()=>remove(s)}>✕</button></td>
                  </tr>; })}</tbody></table>
                <button className="btn sm ghost" style={{marginTop:10}} onClick={()=>dl(wbBlob(wbFromWS([["Comparatif",comparatifWS(f,ss)]])),`EVAL_${f.num}.xlsx`)}>📄 Fiche d'évaluation Excel — {f.num}</button>
              </div>}
            </div>; })}
        </div>}
      </div>;
    })}
    {!subs.length && <div className="card" style={{padding:30,textAlign:"center"}}><p className="mut">Aucune soumission pour l'instant. Les dépôts apparaîtront ici, rangés par lot → formation → prestataire.</p></div>}
  </div>;
}

function Budgets({forms,subs,onSaved}){
  const [edit,setEdit]=useState({}); const [q,setQ]=useState(""); const [busy,setBusy]=useState(false); const [msg,setMsg]=useState("");
  const list=sortForm(forms).filter(f=>!q||(f.num+" "+f.intitule).toLowerCase().includes(q.toLowerCase()));
  const cntByNum={}; subs.forEach(s=>cntByNum[s.formation_num]=(cntByNum[s.formation_num]||0)+1);
  const val=f=> edit[f.num]!==undefined ? edit[f.num] : (f.budget??"");
  async function save(){ setBusy(true); setMsg("");
    try{ for(const num in edit){ const v=edit[num]===""?null:+edit[num]; await sb.from("formations").update({budget:v}).eq("num",num); }
      setEdit({}); setMsg("✓ Budgets enregistrés."); onSaved();
    }catch(e){ setMsg("⚠ "+e.message); } setBusy(false);
  }
  return <div>
    <div className="banner">Le budget est la <b>référence de notation</b> du coût (note = 6). Moins cher → la note monte vers 10 ; plus cher → elle descend vers 1. Les valeurs sont pré-chargées depuis le plan de formation ; modifiez-les si besoin.</div>
    <div className="row" style={{alignItems:"center",marginBottom:14}}>
      <span className="mut">{forms.filter(f=>f.budget).length}/{forms.length} budgets renseignés</span>
      <input className="search" style={{marginLeft:"auto"}} placeholder="Rechercher…" value={q} onChange={e=>setQ(e.target.value)}/>
      <button className="btn" disabled={busy||!Object.keys(edit).length} onClick={save}>{busy?<span className="spin"/>:"💾 Enregistrer"}</button>
    </div>
    {msg&&<div style={{color:msg[0]==="✓"?"var(--ok)":"var(--warn)",fontWeight:600,marginBottom:10}}>{msg}</div>}
    <div className="card" style={{overflow:"hidden"}}>
      <table><thead><tr><th style={{width:55}}>N°</th><th style={{width:70}}>Lot</th><th>Intitulé</th><th style={{width:180}}>Budget HT (FCFA)</th><th style={{width:110}}>Offres reçues</th></tr></thead>
      <tbody>{list.map(f=><tr key={f.num}>
        <td><b>{f.num}</b>{f.a_coter===false&&<span className="mut" title="Non soumise aux fournisseurs"> ⃠</span>}</td><td><span className="pill lotb" style={{fontSize:10}}>{f.lot}</span></td>
        <td style={{fontSize:12}}>{f.intitule}{f.a_coter===false&&<span className="mut"> · (non cotée)</span>}</td>
        <td><input type="number" value={val(f)} onChange={e=>setEdit(x=>({...x,[f.num]:e.target.value}))} placeholder="—"/></td>
        <td className="mut">{cntByNum[f.num]||0}</td>
      </tr>)}</tbody></table>
    </div>
  </div>;
}

function Recap({forms,subs}){
  const [busy,setBusy]=useState(false);
  const sups=[...new Set(subs.map(s=>s.company_name))].sort();
  const exportRecap=()=>dl(wbBlob(wbFromAOA([["Récap Global",recapAOA(forms,subs)]])),"Recap_Appel_Offres_2026.xlsx");

  async function exportZip(){
    setBusy(true);
    try{
      const zip=new JSZip();
      const lots=[...new Set(forms.map(f=>f.lot))].sort();
      const titre=Object.fromEntries(forms.map(f=>[f.lot,f.lot_titre]));
      const byNum={}; subs.forEach(s=>{(byNum[s.formation_num]=byNum[s.formation_num]||[]).push(s);});
      for(const lot of lots){
        const items=sortForm(forms.filter(f=>f.lot===lot && byNum[f.num]));
        if(!items.length) continue;
        const lf=zip.folder(safe(titre[lot]||lot));
        for(const f of items){
          const ss=byNum[f.num];
          const ff=lf.folder(safe(`${f.num}_${f.intitule}`).slice(0,90));
          for(const s of ss){
            const sf=ff.folder(safe(s.company_name));
            for(const [p,n,pref] of [[s.tech_path,s.tech_name,"Offre_technique_"],[s.fin_path,s.fin_name,"Offre_financiere_"]]){
              if(p){ try{ const {data}=await sb.storage.from("offres").download(p); if(data) sf.file(pref+safe(n||"fichier"),data); }catch(e){} }
            }
          }
          ff.file(`EVAL_${f.num}_${safe(f.intitule).slice(0,50)}.xlsx`, wbBlob(wbFromWS([["Comparatif",comparatifWS(f,ss)]])));
        }
      }
      zip.file("RECAP_GLOBAL.xlsx", wbBlob(wbFromAOA([["Récap Global",recapAOA(forms,subs)]])));
      dl(await zip.generateAsync({type:"blob"}),"Archive_AppelOffres_Formations_2026.zip");
    }catch(e){ alert("Erreur ZIP : "+e.message); }
    setBusy(false);
  }

  return <div>
    <div className="grid-cards" style={{marginBottom:20}}>
      <div className="card" style={{padding:18}}>
        <h3 style={{marginBottom:6}}>📊 Récapitulatif Excel</h3>
        <p className="mut" style={{marginBottom:14,fontSize:13}}>Les 78 formations, leur budget et le montant HT de chaque prestataire, en un tableau.</p>
        <button className="btn" style={{width:"100%"}} onClick={exportRecap} disabled={!subs.length}>Télécharger le récap</button>
      </div>
      <div className="card" style={{padding:18}}>
        <h3 style={{marginBottom:6}}>🗂 Archive ZIP complète</h3>
        <p className="mut" style={{marginBottom:14,fontSize:13}}>Arborescence LOT → Bx_Intitulé → Prestataire (offres) + fiche d'évaluation par formation + récap global.</p>
        <button className="btn dark" style={{width:"100%"}} onClick={exportZip} disabled={busy||!subs.length}>{busy?<span className="spin"/>:"Générer & télécharger le ZIP"}</button>
      </div>
    </div>
    <h3 style={{margin:"6px 0 12px"}}>Aperçu du récapitulatif</h3>
    <div className="card" style={{overflow:"auto"}}>
      <table><thead><tr><th>N°</th><th>Lot</th><th>Intitulé</th><th>Budget HT</th>{sups.map(s=><th key={s}>{s}</th>)}</tr></thead>
      <tbody>{sortForm(forms).map(f=><tr key={f.num}>
        <td><b>{f.num}</b></td><td><span className="pill lotb" style={{fontSize:10}}>{f.lot}</span></td>
        <td style={{fontSize:12}}>{(f.intitule||"").slice(0,42)}</td>
        <td>{f.budget?fmt(f.budget):"—"}</td>
        {sups.map(sp=>{ const s=subs.find(x=>x.formation_num===f.num&&x.company_name===sp); return <td key={sp}>{s?fmt(s.montant_ht):"—"}</td>; })}
      </tr>)}</tbody></table>
    </div>
    {!subs.length&&<p className="mut" style={{marginTop:14}}>Les exports s'activeront dès la première soumission.</p>}
  </div>;
}

/* ============ ROOT ============ */
function App(){
  const [session,setSession]=useState(undefined); // undefined = session en cours de vérification
  const [profile,setProfile]=useState(null);

  useEffect(()=>{
    if(!CONFIGURED) return;
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>{ setSession(s||null); if(!s) setProfile(null); });
    return ()=>sub.subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!session){ return; }
    let alive=true;
    const fallback={company_name:session.user.email,role:"supplier"};
    sb.from("profiles").select("*").eq("id",session.user.id).single().then(
      ({data})=>{ if(alive) setProfile(data||fallback); },
      ()=>{ if(alive) setProfile(fallback); }
    );
    return ()=>{ alive=false; };
  },[session]);

  const Spin=sub=><div><Topbar sub={sub}/><div className="center" style={{textAlign:"center"}}><span className="spin"/></div></div>;

  if(CONFIGURED && !sb) return <div><Topbar sub="Erreur de chargement"/><div className="center"><div className="banner">
    ⚠️ <b>La librairie Supabase n'a pas pu se charger.</b><br/>Cause probable : connexion instable, ou un bloqueur de publicités / extension qui bloque les CDN. Rechargez la page (Ctrl+F5).</div></div></div>;
  if(!CONFIGURED) return <div><Topbar sub="Configuration requise"/><div className="center"><div className="banner">
    ⚙️ <b>Application non configurée.</b><br/>Renseignez <code>SUPABASE_URL</code> et <code>SUPABASE_ANON_KEY</code> en haut du script (voir <b>GUIDE_DEPLOIEMENT.md</b>).</div></div></div>;
  if(session===undefined) return Spin("Chargement…");   // on vérifie la session
  if(!session) return <AuthScreen/>;                    // pas connecté
  if(!profile) return Spin("Chargement du profil…");    // connecté, profil en cours de chargement
  const logout=()=>sb.auth.signOut();
  const isAdmin = profile.role==="admin"
    || ADMIN_COMPANIES.map(x=>x.trim().toLowerCase()).includes((profile.company_name||"").trim().toLowerCase());
  return isAdmin
    ? <AdminApp session={session} profile={profile} onLogout={logout}/>
    : <SupplierApp session={session} profile={profile} onLogout={logout}/>;
}

/* Montage compatible React 18 (createRoot) ET React 17 (render) */
(function mount(){
  const el=document.getElementById("root");
  try{
    if(ReactDOM&&typeof ReactDOM.createRoot==="function") ReactDOM.createRoot(el).render(<App/>);
    else if(ReactDOM&&typeof ReactDOM.render==="function") ReactDOM.render(<App/>,el);
    else throw new Error("ReactDOM indisponible (ni createRoot ni render).");
  }catch(e){ if(window.__showFatal) window.__showFatal(e); throw e; }
})();
</script>
<script>
(function(){
  var lastError=null;
  function box(inner){ var r=document.getElementById('root'); if(!r)return;
    r.innerHTML='<div style="max-width:640px;margin:60px auto;font-family:system-ui,sans-serif;padding:22px;border:1px solid #fed7aa;background:#fff7ed;color:#9a3412;border-radius:12px"><h3 style="margin:0 0 10px">L\'application ne s\'est pas affichee</h3>'+inner+'</div>'; }
  window.__showFatal=function(e){ var msg=(e&&(e.message||e))+''; lastError=msg;
    box('<p style="margin:0 0 10px">Une erreur JavaScript est survenue :</p><pre style="white-space:pre-wrap;background:#fff;border:1px solid #fed7aa;border-radius:8px;padding:10px;margin:0 0 10px;font-size:13px">'+msg.replace(/</g,'&lt;')+'</pre><p style="margin:0;font-size:13px">Rechargez avec <b>Ctrl+F5</b> pour vider le cache.</p>'); };
  window.addEventListener('error',function(ev){ if(ev&&ev.message) lastError=ev.message; });
  window.addEventListener('unhandledrejection',function(ev){ if(ev&&ev.reason) lastError=(ev.reason.message||ev.reason)+''; });
  window.addEventListener('load',function(){ setTimeout(function(){
    var r=document.getElementById('root');
    if(r&&r.innerHTML.trim()===''){
      var need={React:window.React,ReactDOM:window.ReactDOM,Babel:window.Babel,'supabase-js':window.supabase,XLSX:window.XLSX,JSZip:window.JSZip};
      var miss=Object.keys(need).filter(function(k){return !need[k];});
      if(miss.length) box('<p style="margin:0">Librairies non chargees : <b>'+miss.join(', ')+'</b>.<br><br>Connexion instable ou bloqueur de publicites/extension bloquant les CDN. Rechargez (Ctrl+F5) ou desactivez le bloqueur pour ce site.</p>');
      else if(lastError) window.__showFatal(lastError);
      else box('<p style="margin:0">Une erreur JavaScript est survenue. Ouvrez la console (F12) et transmettez le message en rouge.</p>');
    }
  },2500); });
})();
</script>

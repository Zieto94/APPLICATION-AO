/* Note « Coût de la prestation » /10 : budget = 6 ; moins cher -> vers 10 ; plus cher -> vers 1 (bornée 1..10) */
function noteCout(montant,budget){
  montant=+montant; budget=+budget;
  if(!montant||!budget||montant<=0||budget<=0) return null;
  let n = montant<=budget ? 6 + 4*(budget-montant)/budget : 6 - 5*(montant-budget)/budget;
  return Math.round(Math.max(1,Math.min(10,n))*100)/100;
}
const noteColor = n => n==null?"#e4e4e7": n>=6?"#dcfce7": n>=4?"#fef9c3":"#fee2e2";

/* ---------- Excel : FICHE D'ÉVALUATION d'une formation (template reproduit) ----------

   Note pondérée = pondération × Note/10. */
function comparatifAOA(f,budget,subs){
  const crit=(lib,pond,fn)=>{ const r=["",lib,pond]; subs.forEach(s=>{ const v=fn?fn(s):["",""]; r.push(v[0],v[1]); }); return r; };
  const r5=["","LIBELLES","pondération"]; subs.forEach(s=>r5.push(s.company_name,""));
  const r6=["","",""]; subs.forEach(()=>r6.push("Note/10","Note pondérée"));
  const rmt=["","Montant HT soumis (FCFA)",""]; subs.forEach(s=>rmt.push(s.montant_ht,""));
  return [
    ["","Evaluation par pondération","PLAN DE FORMATION 2026"],
    [],
    ["","","Thème"],
    ["","Evaluation des offres techniques et commerciale", f.num+" — "+f.intitule],
    ["","Budget de référence (HT)", budget||""],
    ["","Critères"],
    r5, r6,
    crit("Habilitation FDFP",0.1),
    crit("Expertise dans le domaine",0.2),
    crit("Proposition technique",0.3),
    crit("Total technique",""),
    crit("Coût de la prestation",0.5, s=>{ const n=noteCout(s.montant_ht,budget); return n==null?["",""]:[n, Math.round(n*0.5/10*10000)/10000]; }),
    crit("Total",1),
    crit("Classement Global",""),
    [], rmt
  ];
}
function comparatifWS(f,budget,subs){
  const ws=XLSX.utils.aoa_to_sheet(comparatifAOA(f,budget,subs));
  const merges=[]; subs.forEach((s,i)=>{ const c=3+i*2; merges.push({s:{r:6,c},e:{r:6,c:c+1}}); });
  ws["!merges"]=merges;
  ws["!cols"]=[{wch:2},{wch:34},{wch:12}].concat(subs.flatMap(()=>[{wch:9},{wch:13}]));
  return ws;
}
const wbFromWS  = pairs => { const wb=XLSX.utils.book_new(); pairs.forEach(([n,ws])=>XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31))); return wb; };
const wbFromAOA = pairs => wbFromWS(pairs.map(([n,aoa])=>[n,XLSX.utils.aoa_to_sheet(aoa)]));
const wbBlob = wb => new Blob([XLSX.write(wb,{type:"array",bookType:"xlsx"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});

function recapAOA(budgets,subs){
  const sups=[...new Set(subs.map(s=>s.company_name))].sort();
  const head=["N°","Lot","Intitulé","Budget HT (réf.)",...sups.map(s=>s+" — Montant HT")];
  const rows=[head];
  sortForm(FORMATIONS).forEach(f=>{
    const row=[f.num,f.lot,f.intitule,budgets[f.num]||""];
    sups.forEach(sp=>{ const sub=subs.find(x=>x.formation_num===f.num&&x.company_name===sp); row.push(sub?sub.montant_ht:""); });
    rows.push(row);
  });
  return rows;
}

function AuthScreen(){
  const [mode,setMode]=useState("login");
  const [company,setCompany]=useState(""); const [pwd,setPwd]=useState("");
  const [msg,setMsg]=useState(""); const [busy,setBusy]=useState(false);
  async function go(){
    setMsg("");
    if(!company.trim()){ setMsg("⚠ Indiquez le nom de votre société."); return; }
    if(pwd.length<6){ setMsg("⚠ Mot de passe : 6 caractères minimum."); return; }
    setBusy(true);
    const email=emailFor(company);
    try{
      if(mode==="signup"){
        const {data,error}=await sb.auth.signUp({email,password:pwd,options:{data:{company_name:company.trim()}}});
        if(error) throw error;
        if(!data.session){ setMsg("✓ Compte créé. Vous pouvez vous connecter."); setMode("login"); }
      }else{
        const {error}=await sb.auth.signInWithPassword({email,password:pwd});
        if(error) throw (error.message&&/invalid/i.test(error.message))?new Error("Nom de société ou mot de passe incorrect."):error;
      }
    }catch(e){ setMsg("⚠ "+(e.message||"Erreur")); }
    setBusy(false);
  }
  return <div>
    <Topbar sub="Direction des Achats · Orange Côte d'Ivoire"/>

        <div className="field"><label>Nom de la société</label>
          <input value={company} onChange={e=>setCompany(e.target.value)} placeholder="Ex : CABINET I2C" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
        <div className="field"><label>Mot de passe</label>
          <input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
        {msg && <div style={{fontSize:13,marginBottom:12,color:msg[0]==="✓"?"var(--ok)":"var(--warn)"}}>{msg}</div>}
        <button className="btn" style={{width:"100%"}} disabled={busy} onClick={go}>{busy?<span className="spin"/>:(mode==="login"?"Se connecter":"Créer mon compte")}</button>
        <p className="mut" style={{marginTop:16,textAlign:"center"}}>
          {mode==="login"? <>Pas encore de compte ? <span className="link" onClick={()=>{setMode("signup");setMsg("");}}>S'inscrire</span></>
                         : <>Déjà inscrit ? <span className="link" onClick={()=>{setMode("login");setMsg("");}}>Se connecter</span></>}

      </div>

    </div>
  </div>;
}

function SubmitModal({f,uid,company,existing,onClose,onSaved}){
  const [montant,setMontant]=useState(existing?existing.montant_ht:"");
  const [tech,setTech]=useState(null); const [fin,setFin]=useState(null);
  const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  async function up(file,kind){
    const path=`${uid}/${f.num}/${kind}_${Date.now()}_${safe(file.name)}`;
    const {error}=await sb.storage.from("offres").upload(path,file,{upsert:true});
    if(error) throw error; return {path,name:file.name};
  }
  async function submit(){
    setErr("");
    if(!montant||+montant<=0){ setErr("Indiquez un montant HT valide."); return; }
    if(!existing && (!tech||!fin)){ setErr("Joignez l'offre technique ET l'offre financière."); return; }
    setBusy(true);
    try{
      let tp=existing?.tech_path, tn=existing?.tech_name, fp=existing?.fin_path, fn=existing?.fin_name;
      if(tech){ const r=await up(tech,"technique"); tp=r.path; tn=r.name; }
      if(fin){ const r=await up(fin,"financiere"); fp=r.path; fn=r.name; }
      const {error}=await sb.from("submissions").upsert({
        formation_num:f.num, supplier_id:uid, company_name:company, montant_ht:+montant,
        tech_path:tp, tech_name:tn, fin_path:fp, fin_name:fn, updated_at:new Date().toISOString()
      },{onConflict:"formation_num,supplier_id"});
      if(error) throw error;
      onSaved();
    }catch(e){ setErr("⚠ "+(e.message||"Erreur d'enregistrement")); setBusy(false); }
  }
  const Drop=({label,file,cur,set})=> <div className="field">
    <label>{label}{cur&&!file&&<span className="mut"> · actuel : {cur}</span>}</label>
    <label className="drop">{file?("📎 "+file.name):(cur?"Remplacer le fichier…":"Cliquez pour joindre le fichier")}
      <input type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.zip,.rar,.png,.jpg" style={{display:"none"}} onChange={e=>set(e.target.files[0]||null)}/></label></div>;
  return <div className="modal-bg" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}><span className="pill lotb">{f.lot}</span><b>{f.num}</b></div>
    <h2 style={{fontSize:19,marginBottom:16}}>{f.intitule}</h2>
    <div className="field"><label>Montant HT facturé (FCFA)</label>
      <input type="number" value={montant} onChange={e=>setMontant(e.target.value)} placeholder="Ex : 1 500 000"/></div>
    <Drop label="Offre technique" file={tech} cur={existing?.tech_name} set={setTech}/>
    <Drop label="Offre financière" file={fin} cur={existing?.fin_name} set={setFin}/>
    {err&&<div style={{color:"var(--warn)",fontSize:13,marginBottom:12}}>{err}</div>}
    <div className="row" style={{marginTop:6}}>
      <button className="btn ghost col" onClick={onClose}>Annuler</button>
      <button className="btn col" disabled={busy} onClick={submit}>{busy?<span className="spin"/>:"Déposer mon offre"}</button>
    </div>
  </div></div>;
}

function Recap({subs,budgets}){
  const [busy,setBusy]=useState(false);
  const sups=[...new Set(subs.map(s=>s.company_name))].sort();
  const exportRecap=()=>dl(wbBlob(wbFromAOA([["Récap Global",recapAOA(budgets,subs)]])),"Recap_Appel_Offres_2026.xlsx");
  async function exportZip(){
    setBusy(true);
    try{
      const zip=new JSZip();
      const byNum={}; subs.forEach(s=>{(byNum[s.formation_num]=byNum[s.formation_num]||[]).push(s);});
      for(const lot of LOTS){
        const items=sortForm(FORMATIONS.filter(f=>f.lot===lot && byNum[f.num]));
        if(!items.length) continue;
        const lf=zip.folder(safe(`${lot} _ ${LOT_TITRE[lot]}`));
        for(const f of items){
          const ss=byNum[f.num];
          const ff=lf.folder(safe(`${f.num}_${f.intitule}`).slice(0,90));
          for(const s of ss){
            const sf=ff.folder(safe(s.company_name));
            for(const [p,n,pref] of [[s.tech_path,s.tech_name,"Offre_technique_"],[s.fin_path,s.fin_name,"Offre_financiere_"]]){
              if(p){ try{ const {data}=await sb.storage.from("offres").download(p); if(data) sf.file(pref+safe(n||"fichier"),data); }catch(e){} }
            }
          }
          ff.file(`EVAL_${f.num}_${safe(f.intitule).slice(0,50)}.xlsx`, wbBlob(wbFromWS([["Comparatif",comparatifWS(f,budgets[f.num],ss)]])));
        }
      }
      zip.file("RECAP_GLOBAL.xlsx", wbBlob(wbFromAOA([["Récap Global",recapAOA(budgets,subs)]])));
      dl(await zip.generateAsync({type:"blob"}),"Archive_AppelOffres_Formations_2026.zip");
    }catch(e){ alert("Erreur ZIP : "+(e.message||e)); }
    setBusy(false);
  }
  return <div>
    <div className="grid-cards" style={{marginBottom:20}}>
      <div className="card" style={{padding:18}}>
        <h3 style={{marginBottom:6}}>📊 Récapitulatif Excel</h3>
        <p className="mut" style={{marginBottom:14,fontSize:13}}>Les 78 formations, leur budget et le montant HT de chaque prestataire, en un tableau.</p>
        <button className="btn" style={{width:"100%"}} onClick={exportRecap} disabled={!subs.length}>Télécharger le récap</button>
      </div>
      <div className="card" style={{padding:18}}>
        <h3 style={{marginBottom:6}}>🗂 Archive ZIP complète</h3>
        <p className="mut" style={{marginBottom:14,fontSize:13}}>Arborescence LOT → Bx_Intitulé → Prestataire (offres) + fiche d'évaluation par formation + récap global.</p>
        <button className="btn dark" style={{width:"100%"}} onClick={exportZip} disabled={busy||!subs.length}>{busy?<span className="spin"/>:"Générer & télécharger le ZIP"}</button>
      </div>
    </div>
    <h3 style={{margin:"6px 0 12px"}}>Aperçu du récapitulatif</h3>
    <div className="card" style={{overflow:"auto"}}>
      <table><thead><tr><th>N°</th><th>Lot</th><th>Intitulé</th><th>Budget HT</th>{sups.map(s=><th key={s}>{s}</th>)}</tr></thead>
      <tbody>{sortForm(FORMATIONS).map(f=><tr key={f.num}>
        <td><b>{f.num}</b></td><td><span className="pill lotb" style={{fontSize:10}}>{f.lot}</span></td>
        <td style={{fontSize:12}}>{(f.intitule||"").slice(0,42)}</td>
        <td>{budgets[f.num]?fmt(budgets[f.num]):"—"}</td>
        {sups.map(sp=>{ const s=subs.find(x=>x.formation_num===f.num&&x.company_name===sp); return <td key={sp}>{s?fmt(s.montant_ht):"—"}</td>; })}
      </tr>)}</tbody></table>
    </div>
    {!subs.length&&<p className="mut" style={{marginTop:14}}>Les exports s'activeront dès la première soumission.</p>}
  </div>;
}

/* ============ ROOT ============ */
function App(){
  const [session,setSession]=useState(undefined);
  const [profile,setProfile]=useState(null);
  useEffect(()=>{
    if(!CONFIGURED||!sb) return;
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>{ setSession(s||null); if(!s) setProfile(null); });
    return ()=>sub.subscription.unsubscribe();
  },[]);
  useEffect(()=>{
    if(!session) return;
    let alive=true;
    const fallback={company_name:session.user.user_metadata?.company_name||session.user.email,role:"supplier"};
    sb.from("profiles").select("*").eq("id",session.user.id).single().then(
      ({data})=>{ if(alive) setProfile(data||fallback); },
      ()=>{ if(alive) setProfile(fallback); }
    );
    return ()=>{ alive=false; };
  },[session]);
  const Spin=sub=><div><Topbar sub={sub}/><div className="center" style={{textAlign:"center"}}><span className="spin"/></div></div>;
  if(CONFIGURED && !sb) return <div><Topbar sub="Erreur de chargement"/><div className="center"><div className="banner">⚠️ <b>La librairie Supabase n'a pas pu se charger.</b><br/>Rechargez la page (Ctrl+F5).</div></div></div>;
  if(!CONFIGURED) return <div><Topbar sub="Configuration requise"/><div className="center"><div className="banner">⚙️ Renseignez la clé Supabase dans le script (voir GUIDE).</div></div></div>;
  if(session===undefined) return Spin("Chargement…");
  if(!session) return <AuthScreen/>;
  if(!profile) return Spin("Chargement du profil…");
  const logout=()=>sb.auth.signOut();
  const normCo = s => (s||"").trim().toLowerCase().replace(/\s+/g," ");
  const isAdmin = profile.role==="admin" || ADMIN_COMPANIES.map(normCo).includes(normCo(profile.company_name));
  return isAdmin
    ? <AdminApp session={session} profile={profile} onLogout={logout}/>
    : <SupplierApp session={session} profile={profile} onLogout={logout}/>;
}

/* Montage compatible React 18 (createRoot) ET React 17 (render) */
(function mount(){
  const el=document.getElementById("root");
  try{
    if(ReactDOM&&typeof ReactDOM.createRoot==="function") ReactDOM.createRoot(el).render(<App/>);
    else if(ReactDOM&&typeof ReactDOM.render==="function") ReactDOM.render(<App/>,el);
    else throw new Error("ReactDOM indisponible.");
  }catch(e){ if(window.__showFatal) window.__showFatal(e); throw e; }
})();
</script>
<script>
(function(){
  var lastError=null;
  function box(inner){ var r=document.getElementById('root'); if(!r)return;
    r.innerHTML='<div style="max-width:640px;margin:60px auto;font-family:system-ui,sans-serif;padding:22px;border:1px solid #fed7aa;background:#fff7ed;color:#9a3412;border-radius:12px"><h3 style="margin:0 0 10px">L\'application ne s\'est pas affichee</h3>'+inner+'</div>'; }
  window.__showFatal=function(e){ var msg=(e&&(e.message||e))+''; lastError=msg;
    box('<p style="margin:0 0 10px">Une erreur JavaScript est survenue :</p><pre style="white-space:pre-wrap;background:#fff;border:1px solid #fed7aa;border-radius:8px;padding:10px;margin:0 0 10px;font-size:13px">'+msg.replace(/</g,'&lt;')+'</pre><p style="margin:0;font-size:13px">Rechargez avec <b>Ctrl+F5</b>.</p>'); };
  window.addEventListener('error',function(ev){ if(ev&&ev.message) lastError=ev.message; });
  window.addEventListener('unhandledrejection',function(ev){ if(ev&&ev.reason) lastError=(ev.reason.message||ev.reason)+''; });
  window.addEventListener('load',function(){ setTimeout(function(){
    var r=document.getElementById('root');
    if(r&&r.innerHTML.trim()===''){
      var need={React:window.React,ReactDOM:window.ReactDOM,Babel:window.Babel,'supabase-js':window.supabase,XLSX:window.XLSX,JSZip:window.JSZip};
      var miss=Object.keys(need).filter(function(k){return !need[k];});
      if(miss.length) box('<p style="margin:0">Librairies non chargees : <b>'+miss.join(', ')+'</b>. Rechargez (Ctrl+F5) ou desactivez le bloqueur pour ce site.</p>');
      else if(lastError) window.__showFatal(lastError);
      else box('<p style="margin:0">Une erreur JavaScript est survenue. Ouvrez la console (F12) et transmettez le message en rouge.</p>');
    }
  },2500); });
})();
</script>
</body>
